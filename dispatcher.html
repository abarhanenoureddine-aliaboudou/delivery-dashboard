<!-- delivery-dashboard/dispatcher.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DelDash – Dispatcher</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f62fe">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dispatcher.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="lib/leaflet.css">
</head>
<body class="dashboard-body">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-truck-fast"></i>
            <span>DelDash</span>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-panel="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="#" class="nav-item" data-panel="map-view"><i class="fas fa-map-marked-alt"></i> Live Map</a>
            <a href="#" class="nav-item" data-panel="assignments"><i class="fas fa-user-check"></i> Assignments</a>
            <a href="#" class="nav-item" data-panel="notifications"><i class="fas fa-bell"></i> Alerts</a>
        </nav>
        <div class="sidebar-footer">
            <button id="logout-btn" class="btn-icon"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </aside>
    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button id="sidebar-toggle" class="btn-icon"><i class="fas fa-bars"></i></button>
                <h2 class="page-title">Dispatcher Command Center</h2>
            </div>
            <div class="topbar-right">
                <div class="user-info">
                    <img src="https://i.pravatar.cc/32" alt="profile" class="avatar-sm">
                    <span id="current-user-name">Dispatcher</span>
                </div>
            </div>
        </header>
        <div class="panel-container">
            <!-- Dashboard panel with live orders table, quick stats -->
            <section id="panel-dashboard" class="panel active">
                <div class="quick-stats" id="quick-stats-cards">
                    <!-- KPI cards generated dynamically -->
                </div>
                <div class="orders-section">
                    <div class="section-header">
                        <h3>Live Orders</h3>
                        <div class="order-filters">
                            <select id="status-filter">
                                <option value="all">All Status</option>
                                <option value="processing">Processing</option>
                                <option value="dispatched">Dispatched</option>
                                <option value="in-transit">In Transit</option>
                                <option value="delivered">Delivered</option>
                            </select>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="data-table" id="orders-table">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Items</th>
                                    <th>Status</th>
                                    <th>Driver</th>
                                    <th>ETA</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </section>
            <!-- Map view with live tracking and driver markers -->
            <section id="panel-map-view" class="panel">
                <div class="map-container" id="dispatcher-map"></div>
                <div class="map-controls">
                    <button id="center-map-btn" class="btn-secondary"><i class="fas fa-crosshairs"></i> Center</button>
                    <button id="refresh-map-btn" class="btn-secondary"><i class="fas fa-sync-alt"></i> Refresh</button>
                </div>
                <div class="driver-list-panel" id="driver-availability-list">
                    <h4>Driver Availability</h4>
                    <ul id="driver-status-list"></ul>
                </div>
            </section>
            <!-- Driver assignment panel -->
            <section id="panel-assignments" class="panel">
                <div class="assignment-grid">
                    <div class="card unassigned-orders">
                        <h4>Unassigned Orders</h4>
                        <ul id="unassigned-orders-list" class="drag-list"></ul>
                    </div>
                    <div class="card available-drivers">
                        <h4>Available Drivers</h4>
                        <ul id="available-drivers-list" class="drag-list"></ul>
                    </div>
                    <div class="card assignment-area">
                        <h4>Assign Driver to Order</h4>
                        <div class="assignment-controls">
                            <select id="order-select"><option value="">Select order</option></select>
                            <select id="driver-select"><option value="">Select driver</option></select>
                            <button id="assign-btn" class="btn-primary">Assign</button>
                        </div>
                        <div id="assignment-feedback"></div>
                    </div>
                </div>
            </section>
            <!-- Notification stream -->
            <section id="panel-notifications" class="panel">
                <h3>Recent Activity</h3>
                <ul class="notification-list" id="dispatcher-notification-list"></ul>
            </section>
        </div>
    </main>
    <div id="toast-container" class="toast-container"></div>

    <script src="js/app.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="lib/leaflet.js"></script>
    <script src="js/map-utils.js"></script>
    <script src="js/live-tracking.js"></script>
    <script src="js/driver-assignment.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/notification-simulator.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof app !== 'undefined' && app.init) {
                app.init('dispatcher');
            } else {
                console.warn('app.js missing, manual dispatcher init');
                if (typeof initDispatcher === 'function') initDispatcher();
            }
        });
    </script>
</body>
</html>
