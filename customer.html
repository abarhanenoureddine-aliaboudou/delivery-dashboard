<!-- delivery-dashboard/customer.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DelDash – Customer</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f62fe">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/customer.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="lib/leaflet.css">
</head>
<body class="dashboard-body customer-body">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-truck-fast"></i>
            <span>DelDash</span>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-panel="tracking"><i class="fas fa-map-marker-alt"></i> Live Tracking</a>
            <a href="#" class="nav-item" data-panel="order-history"><i class="fas fa-history"></i> Order History</a>
            <a href="#" class="nav-item" data-panel="proof"><i class="fas fa-image"></i> Delivery Proof</a>
            <a href="#" class="nav-item" data-panel="notifications"><i class="fas fa-bell"></i> Notifications</a>
        </nav>
        <div class="sidebar-footer">
            <button id="logout-btn" class="btn-icon"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </aside>
    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <button id="sidebar-toggle" class="btn-icon"><i class="fas fa-bars"></i></button>
                <h2 class="page-title">My Delivery</h2>
            </div>
            <div class="topbar-right">
                <div class="user-info">
                    <img src="https://i.pravatar.cc/32" alt="profile" class="avatar-sm">
                    <span id="current-user-name">Customer</span>
                </div>
            </div>
        </header>
        <div class="panel-container">
            <!-- Live tracking panel with map and timeline -->
            <section id="panel-tracking" class="panel active">
                <div class="tracking-header">
                    <div class="order-summary-card" id="active-order-card">
                        <h3>Current Order</h3>
                        <div class="order-details" id="active-order-details"></div>
                    </div>
                    <div class="timeline-stepper" id="order-timeline"></div>
                </div>
                <div class="map-container" id="customer-tracking-map"></div>
                <div class="driver-info-panel" id="driver-info-card">
                    <h4>Your Driver</h4>
                    <div id="driver-details"></div>
                </div>
            </section>
            <!-- Order history list -->
            <section id="panel-order-history" class="panel">
                <h3>Past Orders</h3>
                <div class="order-history-list" id="order-history-list"></div>
            </section>
            <!-- Delivery proof viewer -->
            <section id="panel-proof" class="panel">
                <h3>Delivery Proof</h3>
                <div class="proof-viewer" id="proof-viewer">
                    <p>Select a delivered order to view its proof.</p>
                </div>
                <div id="proof-modal" class="modal hidden">
                    <div class="modal-content proof-modal-content">
                        <span class="close-modal">&times;</span>
                        <img id="proof-full-image" src="" alt="Delivery proof">
                    </div>
                </div>
            </section>
            <!-- Notifications inbox -->
            <section id="panel-notifications" class="panel">
                <h3>Messages</h3>
                <ul class="notification-list" id="customer-notification-list"></ul>
            </section>
        </div>
    </main>
    <div id="toast-container" class="toast-container"></div>

    <script src="js/app.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="lib/leaflet.js"></script>
    <script src="js/map-utils.js"></script>
    <script src="js/live-tracking.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/notification-simulator.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof app !== 'undefined' && app.init) {
                app.init('customer');
            } else {
                console.warn('app.js missing, manual customer init');
                if (typeof initCustomer === 'function') initCustomer();
            }
        });
    </script>
</body>
</html>
